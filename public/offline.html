<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#01913c">
  <title>Sem conexão</title>
  <style>
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #fafaf9; color: #1b1f27; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 28rem; padding: 2rem 1.25rem; text-align: center; }
    img { width: 72px; height: 72px; }
    h1 { font-size: 1.5rem; margin: 1rem 0 .5rem; }
    p { color: #424a58; margin: .5rem 0; }
    button { margin-top: 1.25rem; min-height: 44px; padding: 0 1.25rem; border: 0; border-radius: 10px; background: #017a32; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:focus-visible { outline: 3px solid #f5b800; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" width="72" height="72">
    <h1>Você está sem conexão</h1>
    <p>Este aplicativo (MEUS 10% e Brasil Fiscal) precisa de internet: os dados oficiais são consultados em tempo real e as partidas são salvas no servidor, para nada ficar desatualizado sem você saber.</p>
    <p>Conecte-se à internet e tente de novo.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
